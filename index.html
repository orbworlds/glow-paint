  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2 && pinch) {
    const q = pinchInfo(); orbit(q.x - pinch.x, q.y - pinch.y);
    if (mode === 'paint') setDepth(depth * pinch.d / q.d); else cam.rT = THREE.MathUtils.clamp(cam.rT * pinch.d / q.d, 5, 30);
    pinch = q; return;
  }

});
const release = (e) => { pointers.delete(e.pointerId); if (drawing) endStroke(); if (!pointers.size) orbitDrag = false; if (pointers.size < 2) pinch = null; };
el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release);
el.addEventListener('pointerleave', () => (cursor.visible = false));
el.addEventListener('wheel', (e) => { e.preventDefault(); if (mode === 'paint') setDepth(depth * Math.exp(e.deltaY * 0.001)); else cam.rT = THREE.MathUtils.clamp(cam.rT * Math.exp(e.deltaY * 0.001), 5, 30); }, { passive: false });
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undo(); }
  else if (/^Digit[1-7]$/.test(e.code)) pickColor(+e.code.slice(5) - 1);
  else if (e.code === 'KeyL') toggleLook();
});

// === UI ===
const $ = (id) => document.getElementById(id), touch = matchMedia('(pointer: coarse)').matches;
depthInput = $('depth'); depthInput.value = depth;
depthInput.addEventListener('input', () => setDepth(+depthInput.value));
const swatches = [...CONFIG.colors, 'rainbow'].map((c, i) => {
  const b = document.createElement('button'); b.className = 'sw'; b.title = i === 6 ? 'Rainbow' : 'Color';
  b.style.background = i === 6 ? 'conic-gradient(#ff5fa8, #ffa64d, #ffe46e, #5dffb2, #4fd4ff, #a580ff, #ff5fa8)' : c;
  b.style.boxShadow = `0 0 12px ${i === 6 ? '#c08cff' : c}`; b.onclick = () => pickColor(i); $('colors').append(b); return b;
});
function pickColor(i) { color = i; swatches.forEach((s, k) => s.classList.toggle('on', k === i)); cursor.material.color.set('#' + brushColor()); }
function setSize(i) { sizeIdx = i; const px = [7, 12, 18][i]; Object.assign($('size').firstElementChild.style, { width: px + 'px', height: px + 'px' }); }
$('size').onclick = () => setSize((sizeIdx + 1) % 3);
function undo() { const st = strokes[strokes.length - 1]; if (st && st !== drawing) { removeStroke(st); save(); } }
$('undo').onclick = undo;
let clearArm = 0;
$('clear').onclick = () => {
  if (performance.now() - clearArm < 2500) { [...strokes].forEach(removeStroke); save(); clearArm = 0; $('clear').classList.remove('warn'); return; }
  clearArm = performance.now(); $('clear').classList.add('warn'); setTimeout(() => $('clear').classList.remove('warn'), 2500);
};
const eyeSvg = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const brushSvg = '<svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19l-5 1 1-5z"/><path d="M12.5 6.5l5 5"/></svg>';
function toggleLook() {
  mode = mode === 'paint' ? 'look' : 'paint'; document.body.classList.toggle('look', mode === 'look'); cursor.visible = false;
  $('look').innerHTML = mode === 'paint' ? eyeSvg : brushSvg; $('look').title = mode === 'paint' ? 'Look around' : 'Back to painting'; $('look').classList.toggle('on', mode === 'look');
}
$('look').onclick = toggleLook; $('look').innerHTML = eyeSvg;
function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(strokes.map(({ c, s, h, p }) => ({ c, s, h, p })))); } catch {} }
function load() {
  let data = null; try { data = JSON.parse(localStorage.getItem(CONFIG.storageKey)); } catch {}
  if (!Array.isArray(data)) return sampleDrawing();
  data.forEach((st) => { if (st && Array.isArray(st.p) && st.p.length >= 3) addStroke({ c: st.c | 0, s: +st.s || 0.08, h: +st.h || 0, p: st.p }); });
}
let hintGone = false;
$('hint').innerHTML = touch ? '<b>Draw</b> with a finger · <b>two fingers</b> to turn<br><b>Pinch</b> to paint nearer or farther'
  : '<b>Drag</b> to paint · <b>right-drag</b> to look around<br><b>Scroll</b> to paint nearer or farther';
function hintDone() { if (hintGone) return; hintGone = true; setTimeout(() => ($('hint').style.opacity = 0), 2500); }
setTimeout(hintDone, 6000);

// Sound: a soft pentatonic chime with an echo while you draw (after the first touch)
let actx = null, master = null, muted = false;
try { muted = localStorage.getItem('glow-paint-muted') === '1'; } catch {}
function audioInit() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.3; master.connect(actx.destination);
      const delay = actx.createDelay(1), fb = actx.createGain(), wet = actx.createGain();
      delay.delayTime.value = 0.32; fb.gain.value = 0.4; wet.gain.value = 0.45;
      master.connect(delay); delay.connect(fb).connect(delay); delay.connect(wet).connect(actx.destination);
    } catch { return; }
  }
  if (actx.state === 'suspended') actx.resume();
}
const PENTA = [0, 2, 4, 7, 9];
function chime(yNorm) {
  if (!actx || muted) return;
  const idx = Math.round((1 - yNorm) * 10), f = 392 * 2 ** ((PENTA[idx % 5] + 12 * Math.floor(idx / 5)) / 12), t0 = actx.currentTime;
  [[f, 0.1, 'sine'], [f * 2.01, 0.025, 'triangle']].forEach(([fr, v, type]) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + 1.5);
  });
}
const muteSvg = () => `<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>${muted ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>' : '<path d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.5a7.8 7.8 0 0 1 0 11"/>'}</svg>`;
$('mute').innerHTML = muteSvg();
$('mute').onclick = () => { muted = !muted; $('mute').innerHTML = muteSvg(); try { localStorage.setItem('glow-paint-muted', muted ? '1' : '0'); } catch {} };
document.addEventListener('visibilitychange', () => { if (actx) document.hidden ? actx.suspend() : actx.resume(); });

load(); pickColor(color); setSize(sizeIdx);
setTimeout(() => orb?.capture?.(), 2500);

// === LOOP ===
const timer = new THREE.Timer(); timer.connect(document);
let T = 0;
renderer.setAnimationLoop((ts) => {
  timer.update(ts); const dt = Math.min(Math.max(timer.getDelta(), 0), 1 / 20); T += dt; idleT += dt;
  // gentle idle sway shows off the 3D drawing; it stops the moment you interact
  if (!drawing && !orbitDrag && !pinch && idleT > 2) { swayAmp = Math.min(1, swayAmp + dt * 0.4); swayPhase += dt * 0.35; }
  sway = Math.sin(swayPhase) * 0.32 * swayAmp;
  const k = Math.min(1, dt * 8);
  cam.yaw += (cam.yawT - cam.yaw) * k; cam.pitch += (cam.pitchT - cam.pitch) * k; cam.r += (cam.rT - cam.r) * Math.min(1, dt * 4);
  camera.position.setFromSphericalCoords(cam.r, Math.PI / 2 - cam.pitch, cam.yaw + sway).add(cam.target); camera.lookAt(cam.target);
  if (drawing?.dirty) { rebuildStroke(drawing); drawing.dirty = false; }
  strokeMat.uniforms.time.value = T;
  // paint-plane disc + brush cursor
  discT = Math.max(0, discT - dt); camera.getWorldDirection(camDir);
  planeDisc.material.opacity = Math.min(1, discT) * 0.35; planeDisc.visible = discT > 0;
  planeDisc.position.copy(camera.position).addScaledVector(camDir, depth); planeDisc.quaternion.copy(camera.quaternion);
  planeDisc.scale.setScalar(depth * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.8);
  cursor.scale.setScalar(CONFIG.sizes[sizeIdx] * depth / 10 * 9); if (color === 6) cursor.material.color.set('#' + brushColor());
  stars.rotation.y += dt * 0.004; updateSparks(dt);
  for (let i = 0; i < CONFIG.dust; i++) { dustArr[i * 3 + 1] += Math.sin(T * 0.5 + i) * dt * 0.08; dustArr[i * 3] += Math.cos(T * 0.3 + i * 1.7) * dt * 0.05; }
  dustGeo.attributes.position.needsUpdate = true;
  composer.render();
});
</script>
